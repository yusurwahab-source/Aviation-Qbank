<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Flight Simulator - C152</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(180deg,#0a1628,#1a2a4a 50%,#0f1e35);color:#e8f0ff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}
  .container{max-width:500px;width:100%;background:rgba(15,30,53,.95);border:2px solid #2a4a7a;border-radius:16px;box-shadow:0 0 40px rgba(50,120,200,.3);overflow:hidden}
  .header{background:linear-gradient(90deg,#1e3a5f,#2a4a7a);padding:15px;text-align:center;border-bottom:2px solid #3a5a8a}
  .header h1{font-size:20px;color:#7fc4ff}
  .header p{font-size:12px;color:#a8c4e8;margin-top:4px}
  .sky{position:relative;height:140px;background:linear-gradient(180deg,#4a7ab5,#6ba3d4 60%,#a8d0f0);overflow:hidden;transition:background 1s}
  .sky.night{background:linear-gradient(180deg,#0a1a3a,#1a2a5a 60%,#3a4a7a)}
  .sky.storm{background:linear-gradient(180deg,#2a2a3a,#4a4a5a 60%,#6a6a7a)}
  .sky.fog{background:linear-gradient(180deg,#8a9aaa,#b0bcc8 60%,#d0d8e0)}
  .sun{position:absolute;top:15px;right:25px;width:40px;height:40px;background:radial-gradient(circle,#fff8a0,#ffcc44);border-radius:50%;box-shadow:0 0 30px #ffcc44}
  .sun.hidden{display:none}
  .cloud{position:absolute;background:rgba(255,255,255,.85);border-radius:50%}
  .cloud::before,.cloud::after{content:'';position:absolute;background:inherit;border-radius:50%}
  .c1{width:60px;height:25px;top:40px;left:-80px;animation:drift 25s linear infinite}
  .c1::before{width:35px;height:35px;top:-15px;left:10px}
  .c1::after{width:30px;height:30px;top:-12px;left:30px}
  .c2{width:80px;height:30px;top:70px;left:-120px;animation:drift 40s linear infinite;animation-delay:-10s}
  .c2::before{width:45px;height:45px;top:-20px;left:15px}
  .c2::after{width:40px;height:40px;top:-18px;left:40px}
  @keyframes drift{from{left:-150px}to{left:110%}}
  .plane{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:40px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));animation:bob 2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
  .plane.shake{animation:shake .4s infinite}
  @keyframes shake{0%,100%{transform:translateX(-50%) rotate(-3deg)}50%{transform:translateX(-50%) rotate(3deg)}}
  .hud{display:flex;justify-content:space-around;background:rgba(10,22,40,.9);padding:10px;border-bottom:1px solid #2a4a7a;font-size:13px}
  .hud-item{text-align:center}
  .hud-item .label{color:#7a9ac4;font-size:10px}
  .hud-item .value{color:#7fc4ff;font-weight:bold;font-size:16px}
  .hud-item .value.warn{color:#ffaa44}
  .hud-item .value.danger{color:#ff5555}
  .content{padding:20px}
  .phase{font-size:11px;color:#7a9ac4;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
  .scenario{font-size:15px;line-height:1.6;margin-bottom:15px;color:#d0e0f8}
  .scenario .highlight{color:#ffcc44;font-weight:bold}
  .question{background:rgba(30,58,95,.5);border-right:3px solid #4a8ac4;padding:12px;border-radius:8px;margin-bottom:15px;font-size:14px;font-weight:bold;color:#a8d0ff}
  .options{display:flex;flex-direction:column;gap:10px}
  .option{background:rgba(30,58,95,.7);border:2px solid #3a5a8a;color:#e8f0ff;padding:14px;border-radius:10px;font-size:14px;text-align:right;cursor:pointer;transition:all .2s;font-family:inherit}
  .option:hover{background:rgba(50,90,140,.8);border-color:#5a9ade;transform:translateX(-3px)}
  .option:active{transform:scale(.98)}
  .option.correct{background:rgba(40,120,60,.9);border-color:#4ade80}
  .option.wrong{background:rgba(140,40,40,.9);border-color:#ff5555}
  .option:disabled{cursor:default;opacity:.85}
  .option:disabled:hover{transform:none}
  .feedback{margin-top:15px;padding:12px;border-radius:8px;font-size:13px;line-height:1.6;display:none}
  .feedback.show{display:block;animation:fadeIn .4s}
  .feedback.correct{background:rgba(40,120,60,.3);border:1px solid #4ade80;color:#b0ffcc}
  .feedback.wrong{background:rgba(140,40,40,.3);border:1px solid #ff5555;color:#ffcccc}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .btn-next{display:none;width:100%;margin-top:15px;padding:14px;background:linear-gradient(90deg,#2a6ab5,#4a9ade);border:none;color:#fff;font-size:16px;font-weight:bold;border-radius:10px;cursor:pointer;font-family:inherit}
  .btn-next.show{display:block;animation:fadeIn .4s}
  .btn-next:hover{background:linear-gradient(90deg,#3a7ac5,#5aaaee)}
  .game-over{text-align:center;padding:20px;display:none}
  .game-over.show{display:block;animation:fadeIn .6s}
  .game-over h2{color:#7fc4ff;margin-bottom:15px;font-size:22px}
  .final-score{font-size:48px;color:#ffcc44;font-weight:bold;margin:15px 0}
  .rank{font-size:18px;color:#a8d0ff;margin-bottom:20px}
  .btn-restart{padding:14px 30px;background:linear-gradient(90deg,#2a6ab5,#4a9ade);border:none;color:#fff;font-size:16px;font-weight:bold;border-radius:10px;cursor:pointer;font-family:inherit}
  .progress-bar{height:4px;background:#1a2a4a;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,#4a8ac4,#7fc4ff);transition:width .4s;width:0%}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>✈️ Weather Flight Simulator</h1>
    <p>Cessna 152 — رحلة عبر الطقس</p>
  </div>
  <div class="sky" id="sky">
    <div class="sun" id="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="plane" id="plane">✈️</div>
  </div>
  <div class="hud">
    <div class="hud-item"><div class="label">SCORE</div><div class="value" id="score">0</div></div>
    <div class="hud-item"><div class="label">FLIGHT</div><div class="value" id="flightNum">1/10</div></div>
    <div class="hud-item"><div class="label">ALT</div><div class="value" id="alt">0 ft</div></div>
    <div class="hud-item"><div class="label">OAT</div><div class="value" id="oat">15°C</div></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
  <div class="content" id="content">
    <div class="phase" id="phase"></div>
    <div class="scenario" id="scenario"></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn-next" id="nextBtn">الرحلة التالية ✈️</button>
  </div>
  <div class="game-over" id="gameOver">
    <h2>🛬 انتهت الرحلة</h2>
    <div class="final-score" id="finalScore">0</div>
    <div class="rank" id="rank"></div>
    <button class="btn-restart" id="restartBtn">🔄 رحلة جديدة</button>
  </div>
</div>
<script>
const scenarios=[
{phase:"المرحلة 1: الاستعداد للإقلاع",alt:"0 ft",oat:"+28°C",sky:"day",
scenario:"أنت على مدرج <span class='highlight'>مطار فينيكس</span> (1135 ft). الحرارة 28°C، الضغط 1013 hPa.",
question:"ماذا تتوقع بشأن مسافة الإقلاع؟",
options:["أقصر من المعتاد","أطول من المعتاد","لا تأثير","لا يمكن تحديده"],
correct:1,
explanation:"ISA عند 1135 ft = +12.7°C. الفرق = ISA +15°C. الكثافة أقل ← مسافة إقلاع أطول."},
{phase:"المرحلة 2: الصعود",alt:"3500 ft",oat:"+10°C",sky:"day",
scenario:"الحرارة تنخفض بمعدل <span class='highlight'>0.8°C/100 m</span>.",
question:"كيف تصف حالة الاستقرار الجوي؟",
options:["مستقر تماماً","غير مستقر تماماً","غير مستقر شرطياً","محايد"],
correct:2,
explanation:"ELR=0.8 بين SALR(0.6) و DALR(1.0) ← Conditional Instability."},
{phase:"المرحلة 3: عبور جبهة باردة",alt:"5000 ft",oat:"+5°C",sky:"storm",
scenario:"تقترب من <span class='highlight'>جبهة باردة نشطة</span>، السحب CB أمامك.",
question:"ما هو الإجراء الأسلم؟",
options:["الدخول مباشرة عبر الجبهة","التحليق فوق السحب","الالتفاف حول السحب بمسافة آمنة 20 NM","الهبوط فوراً"],
correct:2,
explanation:"CB يحتوي على اضطراب شديد، جليد، برَد، وإمكانية Microburst. الالتفاف إلزامي."},
{phase:"المرحلة 4: دخول منطقة ضباب",alt:"1500 ft",oat:"+8°C",sky:"fog",
scenario:"تهبط في مطار ساحلي، الضباب <span class='highlight'>Advection Fog</span> يغطي المدرج، الريح 5 kt.",
question:"ما الشرط الأساسي لتكوّن هذا النوع من الضباب؟",
options:["سماء صافية ورياح هادئة","هواء دافئ رطب يمر فوق سطح بارد","هواء بارد يمر فوق سطح دافئ","انعكاس حراري ليلي"],
correct:1,
explanation:"Advection Fog يحتاج: هواء دافئ رطب + سطح بارد + رياح خفيفة (2-15 kt)."},
{phase:"المرحلة 5: التسلق عبر طبقة باردة",alt:"8000 ft",oat:"-5°C",sky:"day",
scenario:"تدخل سحابة <span class='highlight'>Nimbostratus</span> عند -5°C.",
question:"ما نوع الجليد المتوقع؟",
options:["جليد صافٍ (Clear Ice)","جليد ريم (Rime Ice)","لا يوجد جليد","جليد مختلط"],
correct:1,
explanation:"Nimbostratus يحتوي قطرات صغيرة ← Rime Ice خفيف إلى متوسط."},
{phase:"المرحلة 6: الرياح العلوية",alt:"18000 ft",oat:"-21°C",sky:"day",
scenario:"تطير شرقاً، الريح <span class='highlight'>270/80 kt</span>، الـ Jet Stream شمالك.",
question:"أين تتوقع CAT؟",
options:["في قلب الـ Jet Stream","على الجانب البارد (شمال) تحت القلب","على الجانب الدافئ (جنوب)","بعيداً جداً"],
correct:1,
explanation:"CAT أشد على الجانب البارد للـ Jet Stream، تحت القلب مباشرة."},
{phase:"المرحلة 7: ارتفاع منخفض",alt:"1500 ft",oat:"+12°C",sky:"day",
scenario:"تطير فوق جبال بارتفاع 2000 ft، الريح <span class='highlight'>عمودية على السلسلة 25 kt</span>.",
question:"ما هي السحابة المميزة التي تدل على Mountain Waves؟",
options:["Cumulus","Lenticular","Stratus","Cirrus"],
correct:1,
explanation:"Lenticular clouds (عدسية الشكل) هي العلامة المميزة لـ Mountain Waves."},
{phase:"المرحلة 8: الهبوط في مطار مرتفع",alt:"4000 ft",oat:"+30°C",sky:"day",
scenario:"مطار <span class='highlight'>Denver</span> (5434 ft)، الحرارة 30°C.",
question:"كيف يؤثر هذا على أداء الطائرة؟",
options:["أداء أفضل بسبب الارتفاع","أداء أسوأ بسبب انخفاض الكثافة","لا تأثير","يتحسن التسارع"],
correct:1,
explanation:"ارتفاع + حرارة = كثافة أقل ← رفع أقل، مسافة إقلاع أطول، تسلق أبطأ."},
{phase:"المرحلة 9: عاصفة رعدية",alt:"6000 ft",oat:"+18°C",sky:"storm",
scenario:"ترى <span class='highlight'>Cumulonimbus</span> أمامك مع Microburst.",
question:"ما العلامة التي تدل على Microburst؟",
options:["Virga تحت السحابة","قوس قزح","رياح هادئة","سحب عالية"],
correct:0,
explanation:"Virga (أمطار لا تصل للأرض) علامة على Microburst خطير قادم."},
{phase:"المرحلة 10: التقرير النهائي",alt:"0 ft",oat:"+15°C",sky:"day",
scenario:"بعد الرحلة، تراجع الأحوال الجوية. درجة الحرارة الثابتة فوق 11 km في ISA.",
question:"ما قيمة هذه الحرارة؟",
options:["-40°C","-56.5°C","-75°C","-80°C"],
correct:1,
explanation:"في ISA، درجة الحرارة الثابتة من 11 km إلى 20 km = -56.5°C."}
];
let current=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function render(){
  const s=scenarios[current];answered=false;
  $('phase').textContent=s.phase;
  $('scenario').innerHTML=s.scenario;
  $('question').textContent=s.question;
  $('alt').textContent=s.alt;
  $('oat').textContent=s.oat;
  $('flightNum').textContent=(current+1)+'/'+scenarios.length;
  $('progress').style.width=((current)/scenarios.length*100)+'%';
  $('sky').className='sky'+(s.sky!=='day'?' '+s.sky:'');
  $('sun').className='sun'+(s.sky==='night'||s.sky==='storm'||s.sky==='fog'?' hidden':'');
  $('plane').className='plane'+(s.sky==='storm'?' shake':'');
  $('feedback').className='feedback';
  $('nextBtn').className='btn-next';
  const opts=$('options');opts.innerHTML='';
  s.options.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='option';b.textContent=opt;
    b.onclick=()=>choose(i,b);
    opts.appendChild(b);
  });
  if(s.sky==='storm')$('oat').className='value warn';else $('oat').className='value';
}
function choose(i,btn){
  if(answered)return;answered=true;
  const s=scenarios[current];
  const all=document.querySelectorAll('.option');
  all.forEach((b,idx)=>{
    b.disabled=true;
    if(idx===s.correct)b.classList.add('correct');
    else if(idx===i&&idx!==s.correct)b.classList.add('wrong');
  });
  const fb=$('feedback');
  if(i===s.correct){score+=10;$('score').textContent=score;
    fb.className='feedback show correct';fb.innerHTML='✅ صحيح! <br>'+s.explanation;}
  else{fb.className='feedback show wrong';fb.innerHTML='❌ خطأ. الإجابة الصحيحة: <b>'+s.options[s.correct]+'</b><br>'+s.explanation;}
  $('nextBtn').className='btn-next show';
  $('nextBtn').textContent=current<scenarios.length-1?'الرحلة التالية ✈️':'عرض النتيجة 🏁';
  $('progress').style.width=((current+1)/scenarios.length*100)+'%';
}
$('nextBtn').onclick=()=>{
  if(current<scenarios.length-1){current++;render();}
  else endGame();
};
function endGame(){
  $('content').style.display='none';
  $('gameOver').classList.add('show');
  $('finalScore').textContent=score+' / '+scenarios.length*10;
  let r='';
  if(score>=90)r='🏆 كابتن طيار ممتاز!';
  else if(score>=70)r='✈️ طيار ماهر';
  else if(score>=50)r='📘 تحتاج مراجعة';
  else r='🔄 أعد التدريب';
  $('rank').textContent=r;
}
$('restartBtn').onclick=()=>{
  current=0;score=0;$('score').textContent=0;
  $('gameOver').classList.remove('show');
  $('content').style.display='block';
  $('oat').className='value';
  render();
};
render();
</script>
</body>
</html>
