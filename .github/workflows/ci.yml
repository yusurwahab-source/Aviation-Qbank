name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Validate, lint, typecheck, test
    runs-on: ubuntu-latest

    # The attempt log's guarantees are database guarantees — a unique index and
    # a transaction — so the tests that cover them need a real Postgres. Without
    # one they skip themselves, which would quietly mean no coverage here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qbank
          POSTGRES_PASSWORD: qbank
          POSTGRES_DB: aviation_qbank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://qbank:qbank@127.0.0.1:5432/aviation_qbank_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Question content is checked first: if a question file is malformed,
      # that is the failure worth seeing, not a downstream build error.
      - run: npm run validate:content

      - run: npm run lint

      - run: npm run typecheck

      # Create the tables the integration tests write to.
      - run: npm run db:migrate

      # And load the question content into them. The report and query tests are
      # about behaviour over real questions — which ones are published, which
      # section they belong to, what happens when one is deleted — so an empty
      # bank does not mean "nothing to check", it means those tests cannot run.
      - run: npm run db:seed

      - run: npm run test

      # The build itself needs no database; every page that reads one is dynamic.
      - run: npm run build
