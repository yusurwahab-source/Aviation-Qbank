name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Validate, lint, typecheck, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Question content is checked first: if a question file is malformed,
      # that is the failure worth seeing, not a downstream build error.
      - run: npm run validate:content

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      # The build needs no database: every page that reads one is dynamic.
      - run: npm run build
